<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>要素の追加と削除</title>
</head>
<body>
<h1>写真の一覧</h1>
<p id="sentence">以下のボタンをクリックすると、写真が一覧表示されます。</p>
<div id="box"></div>
<button id="bu" onclick="picuture();">写真を表示</button>
    <script>
       
        function picuture(){
            let place = document.getElementById('box');
            place.insertAdjacentHTML('beforeend','<img src="photo_1.jpg">');
            place.insertAdjacentHTML('beforeend','<img src="photo_2.jpg">');
            place.insertAdjacentHTML('beforeend','<img src="photo_3.jpg">');
            place.insertAdjacentHTML('beforeend','<img src="photo_4.jpg">');
            place.insertAdjacentHTML('beforeend','<img src="photo_5.jpg">');
            place.insertAdjacentHTML('beforeend','<img src="photo_6.jpg">');
            place.insertAdjacentHTML('beforeend','<img src="photo_7.jpg">');
            place.insertAdjacentHTML('beforeend','<img src="photo_8.jpg">');
            document.getElementById('bu').remove();
        }
    </script>
    
</body>
</html>
