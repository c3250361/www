<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複数の要素の取得</title>
</head>
<body>
    <h1>人口の多い国ランキング</h1>
    <ol id="co">
        <li>中国</li>
        <li>インド</li>
        <li>アメリカ</li>
        <li>インドネシア</li>
    </ol>
    <button onclick="hata();">国旗で表示</button>

    <script>
        let contry = document.querySelectorAll('#co li')
        function hata(){
            contry[0].innerHTML = '<img src="flag_CHN.png">'
            contry[1].innerHTML = '<img src="flag_IND.png">'
            contry[2].innerHTML = '<img src="flag_USA.png">'
            contry[3].innerHTML = '<img src="flag_IDN.png">'
        }
    </script>
</body>
</html>
