<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クリックカウント</title>
    <style>
        #wrap{
            padding: auto;
            
        }
    </style>
</head>
<body>
    <div id="wrap">
        <h1>Click Counter★swich構文</h1>
        <p>ボタンをクリックすると、クリック回数に応じて結果が変わります。</p>
        <p>JavaScriptのswich構文を使って処理を作ってみましょう。</p>
        <p>クリック回数　　<span id="clickcount"></span>　回</p>
        <button onclick="A();">クリック</button>
        <p id="anserbox"></p>
    </div>
  
    <script>
          let click = 0;
          let place = document.getElementById('anserbox');
          let counter = document.getElementById('clickcount');
          counter.textContent = click;

        function A(){
          click = click + 1;
        place.textContent = '';
        let star = '';
        let num = 0;
        switch(click){
            case 1:
             for(let i = 1;i <= 1;i++){
                star = star + '★';
            }
            place.textContent = star;
            break
            case 2: 
            for(let i = 1;i <= 5;i++){
                star = star + '★';
            }
             place.textContent = star;
            break
            case 3:
             for(let i = 1;i <= 5;i++){
                star = star + i +',';
            }
             place.textContent = star;
            break
            case 4:
             for(let i = 2;i <= 10;i = i+2){
                 star = star + i +',';
            }
             place.textContent = star;
            break
            case 5:
            for(let i = 1;i <= 5;i++){
                  num = num + i;
            }
             place.textContent = num;
            break
            default:
            star = 'クリアしました。カウントを0に戻します。'
            click = 0;
             place.textContent = star;
        }
         counter.textContent = click;
        }
    </script>
</body>
</html>
