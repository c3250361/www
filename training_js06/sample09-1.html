<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        #message{
            width: 250px;
            border: solid 3px #FF9999;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h3>問題</h3>
    <p>日本で一番高い山は？<button onclick="showAnser();">解答を見る</button></p>
    <div id="message">ここに回答が表示されます。</div>
    <script>
        function showAnser(){
            let anserBox =document.getElementById('message');
            console.log(anserBox);
        }
    </script>
</body>
</html>
