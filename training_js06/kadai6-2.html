<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>要素の取得と内容の変更</title>
    <style>
        #ck{
            color: red;
        }
    </style>
</head>
<body>
  <h1>座席の予約</h1>
  <p>東京会場<span id="ck">(予約受付中)</span></p>  
  <strong id="ty"><button onclick="ch();">予約する</button></strong>

  <script>
    function ch(){
         let checkON =document.getElementById('ck'); 
         checkON.innerHTML= '(予約済み)';
         let thanks =document.getElementById('ty');
         thanks.innerHTML = 'ありがとうございました。';
    }
  </script>
</body>
</html>
